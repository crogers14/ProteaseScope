[project]
name = "proteasescope"
version = "0.7.0.dev2"
description = "In silico protease digestion and digest comparison (predictions only)"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]

[dependency-groups]
dev = ["pytest", "pyteomics", "ruff"]
app = ["shiny==1.9.0", "shinywidgets==0.8.2", "plotly==5.23.0", "openpyxl", "shinylive==0.8.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteasescope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (performance)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
